name: Publish add-on repository

# Tag a release to publish it: bump the version in addon.xml, commit, then
# `git tag v0.1.2 && git push --tags`. Kodi only offers an update when the
# published version is higher than the installed one, so the bump is what makes
# devices pick it up.
#
# Pre-release versions must be written with '~': addon.xml 1.0.0~beta1, tagged
# v1.0.0-beta1, because a git ref cannot contain '~'. Kodi compares versions
# Debian-style - everything after '-' is a revision, and a revision sorts
# ABOVE no revision - so 1.0.0-beta1 would outrank the 1.0.0 that follows it
# and nobody running the beta would ever be offered the release. '~' is the
# one character that sorts below empty, which is what makes it work.
#
# Builds for testers go through prerelease.yml instead: tag them p1.0.0-beta1
# or 1.0.0-beta1-pre and they are attached to a GitHub release without being
# published to the repository at all.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # check-news.sh reads addon.xml at the previous tag. A shallow clone has
          # no tags, so the gate would pass by having nothing to compare against.
          fetch-depth: 0

      - name: Run tests
        run: make test

      - name: Work out the version and check the tag agrees with it
        id: version
        run: |
          set -euo pipefail
          addon_version=$(sed -n 's/.*<addon .*version="\([^"]*\)".*/\1/p' addon.xml)
          [ -n "$addon_version" ] || { echo "no version found in addon.xml" >&2; exit 1; }

          # On a tag the tag decides. On workflow_dispatch there is none, and the run
          # builds and checks everything without publishing.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            # See the note at the top: the tag v1.0.0-beta1 stands for the
            # add-on version 1.0.0~beta1, since '~' cannot appear in a git ref.
            # Done with sed rather than ${x/-/~}, where bash expands the tilde
            # to $HOME and quietly produces 1.0.0/home/runnerbeta1.
            expected=$(printf '%s' "${GITHUB_REF_NAME#v}" | sed 's/-/~/')
            if [ "$addon_version" != "$expected" ]; then
              echo "tag $GITHUB_REF_NAME expects addon.xml version $expected," >&2
              echo "but addon.xml says $addon_version" >&2
              exit 1
            fi
          fi

          echo "version=$addon_version" >> "$GITHUB_OUTPUT"
          echo "Releasing $addon_version"

      # Refuses to release a version the changelog does not describe. The same
      # extractor that writes the body below, so this gate cannot pass a section the
      # body step would then fail to read.
      - name: The changelog describes this version
        run: dev/scripts/changelog-section.sh "${{ steps.version.outputs.version }}" > /dev/null

      # Kodi shows <news> and nothing else: the changelog is not shipped, and the
      # release body is not reachable from inside Kodi. Unchanged since the previous
      # tag means nobody wrote one for this version.
      - name: The news element has been written for this version
        run: dev/scripts/check-news.sh


      - uses: actions/configure-pages@v6
        id: pages

      # base_url is where Pages will actually serve repo/ from, and it has to
      # be baked into the repository add-on before the zip is built.
      #
      # `pages` is the repository plus the landing page. Both go up as one
      # artifact because Pages serves one artifact per site: publishing the
      # repository alone would take the site down, and pages.yml - which
      # republishes the site when only site/ changes - has the same rule from
      # the other side.
      - name: Build add-on, repository and website
        run: make pages REPO_URL=${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: repo

      - name: Build the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # This version's CHANGELOG section, then the standing tail. Runs on every
          # trigger and not only on a tag, so a rehearsal proves the notes come out
          # before the tag exists.
          dev/scripts/changelog-section.sh "$VERSION" > dist/RELEASE_NOTES.md
          printf '\n' >> dist/RELEASE_NOTES.md
          sed -e "1,/^-->$/d" -e "s|@VERSION@|${VERSION}|g" \
              dev/release-notes-tail.md >> dist/RELEASE_NOTES.md
          [ -s dist/RELEASE_NOTES.md ] || { echo "the release notes came out empty" >&2; exit 1; }
          echo "::group::release body"
          cat dist/RELEASE_NOTES.md
          echo "::endgroup::"

      - name: Attach the add-on zip to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          body_path: dist/RELEASE_NOTES.md

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
